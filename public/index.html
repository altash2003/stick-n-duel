<!DOCTYPE html>
<html>
<head>
    <title>Stick N' Duel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth" class="modal">
        <div class="pixel-box auth-box">
            <h1 class="yellow">STICK N' DUEL</h1>
            <p id="err" class="red"></p>
            <input id="u" placeholder="USERNAME" maxlength="12">
            <input id="p" type="password" placeholder="PASSWORD" maxlength="12">
            <button onclick="auth('login')">LOGIN</button>
            <button onclick="auth('register')" class="blue">REGISTER</button>
        </div>
    </div>

    <div class="wrapper">
        <div class="col side">
            <div class="pixel-box">
                <h3>PLAYERS ONLINE</h3>
                <div id="plist"></div>
            </div>
            <div class="pixel-box">
                <h3>MIC SETTINGS</h3>
                <button>PTT: OFF</button>
            </div>
        </div>

        <div class="col main">
            <div class="pixel-box game-panel">
                <div id="pot-ui" class="yellow">POT: 0</div>
                <div id="arena">
                    <div id="sl" class="seat">LEFT</div>
                    <div id="visual">VS</div>
                    <div id="sr" class="seat">RIGHT</div>
                </div>
                <div id="controls"></div>
                <button id="act-btn" style="display:none" onclick="socket.emit('act')">ACTION!</button>
            </div>
        </div>

        <div class="col side">
            <div class="pixel-box">
                <h3>BETTING (1.9x)</h3>
                <div id="spec-ui">
                    <input id="samt" type="number" placeholder="TC">
                    <button onclick="spec('l')">BET L</button>
                    <button onclick="spec('r')">BET R</button>
                </div>
            </div>
            <div class="pixel-box chat-box">
                <div id="history"></div>
                <input id="cin" placeholder="ENTER TO CHAT">
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
